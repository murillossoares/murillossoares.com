<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sonda de conectividade</title>
<style>
  :root { --bg:#fff; --fg:#111; --muted:#666; --ok:#1a7f37; --bad:#c62828; --wait:#8a6d00; --line:#ddd; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --muted:#999; --ok:#3fb950; --bad:#ff6b6b; --wait:#e3b341; --line:#333; } }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui, sans-serif; }
  h1 { font-size:1.25rem; margin:0 0 4px; }
  p { color:var(--muted); margin:0 0 12px; }
  table { border-collapse:collapse; width:100%; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; font-size:14px; }
  td.h { word-break:break-all; }
  .ok { color:var(--ok); font-weight:600; } .bad { color:var(--bad); font-weight:600; } .wait { color:var(--wait); }
  small { color:var(--muted); display:block; word-break:break-all; }
  textarea { width:100%; box-sizing:border-box; height:9em; font:12px/1.3 ui-monospace, monospace; margin-top:12px; background:var(--bg); color:var(--fg); border:1px solid var(--line); }
  button, input { font:inherit; padding:6px 10px; margin:8px 8px 0 0; }
  input { width:min(100%, 420px); box-sizing:border-box; }
</style>
</head>
<body>
<h1>Sonda de conectividade</h1>
<p>Testa, a partir deste navegador, se cada gateway responde por HTTPS e aceita WebSocket. Não expõe nenhum desktop.</p>
<table>
  <thead><tr><th>Gateway</th><th>HTTPS</th><th>WebSocket</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<input id="extra" placeholder="https://outro-gateway.exemplo (opcional)">
<button id="add">Testar este URL</button>
<button id="rerun">Repetir tudo</button>
<button id="copy">Copiar resultado</button>
<textarea id="out" readonly></textarea>
<script>
// Edite esta lista ao trocar de túnel. Também aceita #https://a,https://b na URL.
const CANDIDATES = [
  ["Cloudflare quick tunnel (trycloudflare.com)", "https://fill-podcasts-college-advertising.trycloudflare.com"],
  ["Tailscale Funnel (controle, *.ts.net)", "https://thinkcentre-m93p.tail68e134.ts.net:10000"],
  ["Microsoft Dev Tunnels (*.devtunnels.ms)", "https://4xm70v9l-6099.uks1.devtunnels.ms"],
];
const TIMEOUT_MS = 12000;
const results = {};

function row(name, base) {
  const tr = document.createElement("tr");
  tr.innerHTML = `<td class="h">${name}<small>${base}</small><small><a href="${base}/probe" target="_blank" rel="noopener">abrir direto</a> (fallback se a CSP bloquear)</small></td><td class="wait">…</td><td class="wait">…</td>`;
  document.getElementById("rows").appendChild(tr);
  return tr;
}

async function testHttp(base) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), TIMEOUT_MS);
  const t0 = performance.now();
  try {
    const r = await fetch(base + "/probe", { mode: "cors", cache: "no-store", signal: ctl.signal });
    const j = await r.json();
    return { ok: j.http === "ok", ms: Math.round(performance.now() - t0), status: r.status, fwd: j.fwd };
  } catch (e) {
    return { ok: false, ms: Math.round(performance.now() - t0), error: String(e && e.name || e) };
  } finally { clearTimeout(t); }
}

function testWs(base) {
  return new Promise(resolve => {
    const t0 = performance.now();
    let ws, done = false;
    const finish = r => { if (!done) { done = true; clearTimeout(t); try { ws && ws.close(); } catch (_) {} resolve({ ms: Math.round(performance.now() - t0), ...r }); } };
    const t = setTimeout(() => finish({ ok: false, error: "timeout" }), TIMEOUT_MS);
    try { ws = new WebSocket(base.replace(/^http/, "ws") + "/ws"); } catch (e) { return finish({ ok: false, error: String(e) }); }
    ws.onmessage = ev => { let ok = false; try { ok = JSON.parse(ev.data).ws === "ok"; } catch (_) {} finish({ ok, data: ev.data }); };
    ws.onerror = () => finish({ ok: false, error: "error" });
    ws.onclose = ev => finish({ ok: false, error: "closed " + ev.code });
  });
}

function fmt(td, r) {
  td.className = r.ok ? "ok" : "bad";
  td.textContent = (r.ok ? "OK" : "FALHOU") + " " + r.ms + " ms";
  if (!r.ok && r.error) td.appendChild(Object.assign(document.createElement("small"), { textContent: r.error }));
}

async function run(name, base) {
  base = base.replace(/\/+$/, "");
  const tr = row(name, base);
  const [h, w] = await Promise.all([testHttp(base), testWs(base)]);
  fmt(tr.children[1], h); fmt(tr.children[2], w);
  results[base] = { name, http: h, ws: w };
  document.getElementById("out").value = JSON.stringify({ ua: navigator.userAgent, at: new Date().toISOString(), results }, null, 1);
}

function all() {
  document.getElementById("rows").innerHTML = "";
  const extra = location.hash.slice(1).split(",").filter(Boolean).map(u => ["(hash)", decodeURIComponent(u)]);
  [...CANDIDATES, ...extra].forEach(([n, b]) => run(n, b));
}
document.getElementById("rerun").onclick = all;
document.getElementById("add").onclick = () => { const v = document.getElementById("extra").value.trim(); if (v) run("(manual)", v); };
document.getElementById("copy").onclick = () => navigator.clipboard.writeText(document.getElementById("out").value).catch(() => {});
all();
</script>
</body>
</html>
